---
name: Continuous Delivery
on:
  workflow_call:
    inputs:
      skip_what_if:
        default: false
        type: boolean
      governance-int-root:
        type: boolean
        default: true
      governance-sandbox:
        type: boolean
        default: true
      governance-test:
        type: boolean
        default: false

jobs:
  whatif:
    name: What If
    runs-on:
      ubuntu-latest
    concurrency: alz-tfstate
    environment: t4308-alz-plan
    permissions:
      id-token: write
      contents: read
    if: ${{ !inputs.skip_what_if }}
    env:
      PARAMETERS_FILE_NAME: parameters.json

    steps:
      - name: Show inputs
        run: |
          Write-Host '${{ toJson(inputs) }}'
        shell: pwsh

      - name: Checkout Bicep Module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Bicep Variables
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-variables@main
        with:
          parameters_file_name: ${{ env.PARAMETERS_FILE_NAME }}

      - name: Install Bicep and Update Az Module
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-installer@main

      - name: OIDC Login to Tenant
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Check for First Deployment
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-first-deployment-check@main
        with:
          managementGroupId: ${{ env.MANAGEMENT_GROUP_ID }}

      - name: 'Plan: Governance-Intermediate Root'
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-int-root }}
        with:
          name: 'governance-int-root'
          displayName: 'Governance-Intermediate Root'
          templateFilePath: 'templates/core/governance/mgmt-groups/int-root/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/int-root/main.bicepparam'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

      - name: 'Plan: Governance-Sandbox'
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-sandbox }}
        with:
          name: 'governance-sandbox'
          displayName: 'Governance-Sandbox'
          templateFilePath: 'templates/core/governance/mgmt-groups/sandbox/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/sandbox/main.bicepparam'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'


      - name: 'Plan: Governance-Test'
        if: ${{ inputs.governance-test }}
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-deploy@main
        with:
          name: 'governance-test'
          displayName: 'Governance-Test'
          templateFilePath: 'templates/core/governance/mgmt-groups/test/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/test/main.bicepparam'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
          firstRunWhatIf: 'false'
          whatIfEnabled: 'true'

  deploy:
    name: Deploy
    needs: whatif
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on:
      ubuntu-latest
    concurrency: alz-tfstate
    environment: t4308-alz-apply
    permissions:
      id-token: write
      contents: read
    env:
      PARAMETERS_FILE_NAME: parameters.json

    steps:
      - name: Show inputs
        run: |
          Write-Host '${{ toJson(inputs) }}'
        shell: pwsh

      - name: Checkout Bicep Module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Bicep Variables
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-variables@main
        with:
          parameters_file_name: ${{ env.PARAMETERS_FILE_NAME }}

      - name: Install Bicep and Update Az Module
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-installer@main

      - name: OIDC Login to Tenant
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: 'Deploy: Governance-Intermediate Root'
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-int-root }}
        with:
          name: 'governance-int-root'
          displayName: 'Governance-Intermediate Root'
          templateFilePath: 'templates/core/governance/mgmt-groups/int-root/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/int-root/main.bicepparam'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'

      - name: 'Deploy: Governance-Sandbox'
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-deploy@main
        if: ${{ inputs.governance-sandbox }}
        with:
          name: 'governance-sandbox'
          displayName: 'Governance-Sandbox'
          templateFilePath: 'templates/core/governance/mgmt-groups/sandbox/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/sandbox/main.bicepparam'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'

      - name: 'Deploy: Governance-Test'
        if: ${{ inputs.governance-test }}
        uses: alz-prince-lab/t4308-alz-templates/.github/actions/bicep-deploy@main
        with:
          name: 'governance-test'
          displayName: 'Governance-Test'
          templateFilePath: 'templates/core/governance/mgmt-groups/test/main.bicep'
          templateParametersFilePath: 'templates/core/governance/mgmt-groups/test/main.bicepparam'
          subscriptionId: '${{ env.SUBSCRIPTION_ID_MANAGEMENT }}'
          resourceGroupName: ''
          location: '${{ env.LOCATION }}'
          deploymentType: 'managementGroup'
